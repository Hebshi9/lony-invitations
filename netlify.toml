[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  port = 5173

[functions]
  directory = "netlify/functions"

# Static Files
[[redirects]]
  from = "/check-in.html"
  to = "/check-in.html"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
