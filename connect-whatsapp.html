<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>ربط واتساب سريع</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
        }

        #qr {
            margin: 20px;
            border: 2px solid #ddd;
            padding: 10px;
            display: inline-block;
        }

        img {
            max-width: 300px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>ربط واتساب فوري</h1>
    <p>اضغط الزر أدناه لجلب الباركود مباشرة من Evolution API</p>

    <button onclick="getQR()">جلب الباركود</button>

    <div id="status" style="margin-top: 20px; font-weight: bold;"></div>
    <div id="qr"></div>

    <script>
        // Instance name we created
        const INSTANCE = 'lony-whatsapp';
        const API_KEY = '429683C4C977415CAAFCCE10F7D57E11';

        async function getQR() {
            document.getElementById('status').innerText = "جاري الاتصال بـ Evolution API...";
            document.getElementById('qr').innerHTML = "";

            try {
                // First ensure instance exists
                await fetch('http://localhost:8081/instance/create', {
                    method: 'POST',
                    headers: { 'apikey': API_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instanceName: INSTANCE, qrcode: true, integration: "WHATSAPP-BAILEYS" })
                });

                // Get QR
                const res = await fetch(`http://localhost:8081/instance/connect/${INSTANCE}`, {
                    headers: { 'apikey': API_KEY }
                });

                const data = await res.json();
                console.log(data);

                // Evolution v2 return structure varies
                const base64 = data.base64 || data.qrcode?.base64 || data.code || data;

                if (base64 && base64.startsWith('data:image')) {
                    document.getElementById('qr').innerHTML = `<img src="${base64}" />`;
                    document.getElementById('status').innerText = "امسح الباركود الآن!";
                    checkStatus();
                } else if (data.instance?.state === 'open') {
                    document.getElementById('status').innerText = "✅ متصل مسبقاً!";
                } else {
                    document.getElementById('status').innerText = "بيانات غير مفهومة: " + JSON.stringify(data).substring(0, 50);
                }

            } catch (e) {
                document.getElementById('status').innerText = "خطأ: " + e.message;
            }
        }

        async function checkStatus() {
            setInterval(async () => {
                try {
                    const res = await fetch(`http://localhost:8081/instance/connectionState/${INSTANCE}`, {
                        headers: { 'apikey': API_KEY }
                    });
                    const data = await res.json();
                    if (data.instance?.state === 'open') {
                        document.getElementById('status').innerText = "🎉 تم الاتصال بنجاح!";
                        document.getElementById('qr').innerHTML = "✅";
                    }
                } catch (e) { }
            }, 3000);
        }
    </script>
</body>

</html>
