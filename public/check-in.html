<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة خاصة - Lony Invitations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c5a365;
            --primary-dark: #8c7343;
            --success: #059669;
            --error: #dc2626;
            --warning: #d97706;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --bg-color: #FDFBF7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            background-image: none;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header-bg {
            height: 160px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid #f3f4f6;
        }

        .header-logo {
            max-height: 120px;
            max-width: 80%;
            object-fit: contain;
        }

        .status-icon-wrapper {
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .content {
            padding: 60px 30px 40px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .guest-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: right;
        }

        .guest-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: var(--text-light);
            font-size: 14px;
        }

        .value {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 16px;
        }

        .timer-box {
            background: var(--warning);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .timer-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px;
            border-radius: 8px;
        }

        .timer-val {
            font-size: 20px;
            font-weight: bold;
        }

        .timer-label {
            font-size: 10px;
            opacity: 0.9;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .history-section {
            margin-top: 30px;
            border-top: 1px dashed #e2e8f0;
            padding-top: 20px;
        }

        .history-title {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 12px;
            text-align: center;
        }

        .scan-pill {
            display: inline-flex;
            align-items: center;
            background: #eff6ff;
            color: var(--primary-dark);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            margin: 4px;
        }
    </style>
</head>

<body>
    <div class="container" id="app">
        <div class="content" style="padding-top: 40px;">
            <div class="spinner"></div>
            <h3>جاري التحقق من الدعوة...</h3>
        </div>
    </div>

    <script>
        const API_URL = 'https://gxunxhzjqclddoobxvpz.supabase.co/rest/v1';
        const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4dW54aHpqcWNsZGRvb2J4dnB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ1MzAzNDMsImV4cCI6MjA4MDEwNjM0M30.OoOj_c7cqbsO_lzFKSM6hhPAg2F_F5gpRwBgDh74TXg';

        const urlParams = new URLSearchParams(window.location.search);
        const qrToken = urlParams.get('token');

        // Debug log helper
        function debugLog(msg) {
            console.log('[CHECK-IN DEBUG]', msg);
        }

        async function apiCall(endpoint, options = {}) {
            try {
                const url = `${API_URL}${endpoint}`;
                debugLog('📡 Fetching: ' + url);
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        'apikey': API_KEY,
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation',
                        ...options.headers
                    }
                });
                debugLog('📥 Status: ' + response.status);
                if (!response.ok) {
                    const errText = await response.text();
                    debugLog('❌ Error body: ' + errText);
                    throw new Error(`API Error: ${response.status} - ${errText}`);
                }
                const data = await response.json();
                debugLog('✅ Data count: ' + (Array.isArray(data) ? data.length : 'object'));
                return data;
            } catch (error) {
                debugLog('🔥 Exception: ' + error.message);
                console.error(error);
                throw error;
            }
        }

        async function init() {
            // Add debug panel
            debugLog('🚀 Init started. Token: ' + qrToken);

            // ─── TEST MODE HANDLING ───
            const testMode = urlParams.get('_test_mode');
            if (testMode) {
                const mockGuest = { name: 'عبدالله محمد', table_no: '5', companions_count: 2 };
                const mockEvent = { name: 'حفل زفاف ساره وخالد', qr_active_from: new Date(Date.now() + 86400000).toISOString() };

                if (testMode === 'countdown') {
                    showCountdown(mockGuest, mockEvent, new Date(Date.now() + 86400000));
                    return;
                }
                if (testMode === 'expired') {
                    showExpired(mockGuest, mockEvent);
                    return;
                }
                if (testMode === 'success') {
                    showSuccess(mockGuest, mockEvent, [{ scanned_at: new Date().toISOString() }]);
                    return;
                }
                if (testMode === 'duplicated') {
                    showAlreadyScanned(mockGuest, mockEvent, [{ scanned_at: new Date(Date.now() - 3600000).toISOString() }]);
                    return;
                }
            }

            if (!qrToken) return showError('رابط غير صالح', 'لم يتم العثور على رمز الدعوة');

            try {
                const guests = await apiCall(`/guests?qr_token=eq.${qrToken}&select=*,events(*)`);
                debugLog('📋 Guests result: ' + JSON.stringify(guests?.length));
                if (!guests || guests.length === 0) return showError('دعوة غير صالحة', 'عذراً، لم نتمكن من العثور على هذه الدعوة');

                const guest = guests[0];
                const event = guest.events;

                // ─── CHECK ACTIVATION WINDOW ───
                // Only enforce time restrictions if explicitly enabled for the event
                if (event.qr_activation_enabled) {
                    let activeFrom, activeUntil;

                    if (event.qr_active_from) {
                        activeFrom = new Date(event.qr_active_from);
                        activeUntil = new Date(event.qr_active_until);
                    } else if (event.date) {
                        // Fallback: Opens at 1:00 PM on event day
                        activeFrom = new Date(event.date);
                        activeFrom.setHours(13, 0, 0, 0);
                        activeUntil = new Date(activeFrom);
                        activeUntil.setHours(activeFrom.getHours() + 24);
                    }

                    if (activeFrom && activeUntil) {
                        const now = new Date();
                        if (now < activeFrom) {
                            return showCountdown(guest, event, activeFrom);
                        }
                        if (now > activeUntil) {
                            return showExpired(guest, event);
                        }
                    }
                }

                // ─── CHECK HOST PIN ───
                const pinVerified = sessionStorage.getItem(`pin_verified_${qrToken}`);
                const alreadyChecked = sessionStorage.getItem('just_checked');
                if (event.features && event.features.enable_host_pin && event.host_pin && !pinVerified) {
                    return showPinScreen(guest, event);
                }

                // ─── PROCEED TO CHECK-IN ───
                await proceedToCheckIn(guest, event, alreadyChecked);

            } catch (error) {
                showError('خطأ غير متوقع', 'حدث خطأ أثناء معالجة الطلب');
            }
        }

        async function proceedToCheckIn(guest, event, alreadyChecked = false) {
            try {
                const scans = await apiCall(`/scans?guest_id=eq.${guest.id}&order=scanned_at.desc`);
                const totalAllowed = 1 + (guest.companions_count || 0);
                const totalScanned = scans.length;
                const remaining = totalAllowed - totalScanned;

                if (remaining > 0 && !alreadyChecked) {
                    // Update UI optimistically BEFORE the wait if it's better for perceived speed
                    // But here we need the scan record to show the exact time, so we do it in order
                    await performCheckIn(guest, event.id);
                    sessionStorage.setItem('just_checked', '1');
                    const newScans = await apiCall(`/scans?guest_id=eq.${guest.id}&order=scanned_at.desc`);
                    showSuccess(guest, event, newScans);
                } else {
                    showAlreadyScanned(guest, event, scans);
                }
            } catch (err) {
                showError('خطأ أثناء التحضير', 'حدث خطأ أثناء محاولة تسجيل الحضور');
            }
        }

        async function performCheckIn(guest, eventId) {
            // 1. Insert Scan
            await apiCall('/scans', {
                method: 'POST',
                body: JSON.stringify({
                    guest_id: guest.id,
                    event_id: eventId,
                    scanned_at: new Date().toISOString()
                })
            });

            // 2. Update Guest State
            const currentAttended = guest.companions_attended || 0;
            const newAttendedCount = guest.attended ? currentAttended + 1 : currentAttended;
            
            try {
                await apiCall(`/guests?id=eq.${guest.id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({
                        attended: true,
                        attended_at: guest.attended_at || new Date().toISOString(),
                        companions_attended: newAttendedCount,
                        scan_count: (guest.scan_count || 0) + 1
                    }),
                    headers: { 'Prefer': 'return=minimal' }
                });
            } catch (err) {
                console.warn('Guest state update skipped', err);
            }
        }

        // ─── UI FUNCTIONS ───

        function renderLayout(icon, title, subtitle, content) {
            document.getElementById('app').innerHTML = `
                <div class="header-bg">
                    <img src="logo.jpg" alt="Logo" class="header-logo" onerror="this.style.display='none'">
                    <div class="status-icon-wrapper">${icon}</div>
                </div>
                <div class="content">
                    <h1>${title}</h1>
                    <p class="subtitle">${subtitle}</p>
                    ${content}
                </div>
            `;
        }

        function showCountdown(guest, event, targetDate) {
            setInterval(() => {
                const now = new Date().getTime();
                const distance = targetDate.getTime() - now;

                if (distance < 0) { location.reload(); return; }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('timer').innerHTML = `
                    <div class="timer-item"><span class="timer-val">${seconds}</span><span class="timer-label">ثانية</span></div>
                    <div class="timer-item"><span class="timer-val">${minutes}</span><span class="timer-label">دقيقة</span></div>
                    <div class="timer-item"><span class="timer-val">${hours}</span><span class="timer-label">ساعة</span></div>
                    <div class="timer-item"><span class="timer-val">${days}</span><span class="timer-label">يوم</span></div>
                `;
            }, 1000);

            renderLayout(
                '⏳',
                'عذراً، الحفل لم يبدأ بعد',
                `سيتم فتح بوابة الدخول للدعوة الخاصة بـ <strong>${guest.name}</strong> خلال:`,
                `<div class="timer-box"><div class="timer-grid" id="timer"></div></div>
                 <div class="guest-card">
                    <div class="info-row"><span class="label">المناسبة</span><span class="value">${event.name}</span></div>
                    <div class="info-row"><span class="label">موعد الفتح</span><span class="value">${targetDate.toLocaleString('ar-SA')}</span></div>
                 </div>`
            );
        }

        function showExpired(guest, event) {
            renderLayout(
                '🔒',
                'انتهت صلاحية الدعوة',
                'عذراً، لقد انتهى الوقت المحدد للدخول بهذه الدعوة',
                `<div class="guest-card">
                    <div class="guest-name">${guest.name}</div>
                    <div class="info-row"><span class="label">الحدث</span><span class="value">${event.name}</span></div>
                    <div class="info-row"><span class="label">الحالة</span><span class="value" style="color:var(--error)">منتهية الصلاحية</span></div>
                 </div>`
            );
        }

        function showSuccess(guest, event, scans) {
            sessionStorage.removeItem('just_checked');
            const total = 1 + (guest.companions_count || 0);
            const used = scans.length;
            const left = total - used;
            const isPinEvent = event.features && event.features.enable_host_pin && event.host_pin;

            let cardContent = `<div class="guest-card">
                <div class="guest-name">${guest.name}</div>
                <div class="info-row"><span class="label">الحدث</span><span class="value">${event.name}</span></div>
                ${guest.table_no ? `<div class="info-row"><span class="label">الطاولة</span><span class="value">${guest.table_no}</span></div>` : ''}`;

            if (isPinEvent) {
                const exactDate = new Date(scans[0].scanned_at).toLocaleString('ar-SA', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                cardContent += `
                    <div class="info-row"><span class="label">إجمالي الأفراد (سعة الدعوة)</span><span class="value">${total}</span></div>
                    <div class="info-row"><span class="label">المسحات المسجلة (تم الدخول)</span><span class="value">${used}</span></div>
                    <div class="info-row"><span class="label">التذاكر المتبقية</span><span class="value" style="color:${left > 0 ? 'var(--success)' : 'var(--error)'}; font-size: 18px; font-weight: 800;">${left}</span></div>
                    <div class="info-row" style="flex-direction:column; align-items:flex-start; margin-top:12px; border-top: 1px dashed #e2e8f0; padding-top: 8px;">
                        <span class="label" style="margin-bottom:4px; font-size:12px;">تاريخ ووقت أحدث دخول:</span>
                        <span class="value" style="font-size:14px; font-weight:bold; color:var(--text)">${exactDate}</span>
                    </div>
                 </div>`;
            } else {
                cardContent += `
                    <div class="info-row"><span class="label">عدد الأفراد المسموح</span><span class="value">${total}</span></div>
                    <div class="info-row"><span class="label">حالة الدخول</span><span class="value" style="color:var(--success)">تم تسجيل الحضور (${used})</span></div>
                    <div class="info-row"><span class="label">المتبقي</span><span class="value" style="color:${left > 0 ? 'var(--success)' : 'var(--error)'}; font-weight: 800;">${left}</span></div>
                 </div>`;
            }

            renderLayout(
                '<span style="color:var(--success)">✓</span>',
                'تم تسجيل الدخول بنجاح',
                'أهلاً بك، نتمنى لك وقتاً ممتعاً!',
                `${cardContent}
                 <div class="history-section">
                    <div class="history-title">سجل الدخول</div>
                    ${scans.map(s => `<span class="scan-pill">🕒 ${new Date(s.scanned_at).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })}</span>`).join('')}
                 </div>`
            );
        }

        function showAlreadyScanned(guest, event, scans) {
            if (qrToken) sessionStorage.removeItem(`pin_verified_${qrToken}`);
            const isPinEvent = event.features && event.features.enable_host_pin && event.host_pin;

            let cardContent = `<div class="guest-card">
                <div class="guest-name">${guest.name}</div>`;

            if (isPinEvent) {
                const exactDate = new Date(scans[0].scanned_at).toLocaleString('ar-SA', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                cardContent += `
                    <div class="info-row"><span class="label">إجمالي المسحات المسجلة (حتى الآن)</span><span class="value">${scans.length}</span></div>
                    <div class="info-row" style="flex-direction:column; align-items:flex-start; margin-top:8px; border-top:1px dashed #e2e8f0; padding-top:8px;">
                        <span class="label" style="margin-bottom:4px; font-size:12px; color:var(--error)">تاريخ ووقت آخر مسحة مسجلة:</span>
                        <span class="value" style="font-size:14px; font-weight:bold; color:var(--text)">${exactDate}</span>
                    </div>
                 </div>`;
            } else {
                cardContent += `
                    <div class="info-row"><span class="label">مرات الدخول</span><span class="value">${scans.length}</span></div>
                    <div class="info-row"><span class="label">آخر دخول</span><span class="value">${new Date(scans[0].scanned_at).toLocaleString('ar-SA')}</span></div>
                 </div>`;
            }

            renderLayout(
                '<span style="color:var(--error)">✕</span>',
                'تم استخدام الدعوة مسبقاً',
                'عذراً، تم استهلاك جميع مرات الدخول المتاحة',
                cardContent
            );
        }

        function showError(title, msg) {
            document.getElementById('app').innerHTML = `
                <div class="content" style="text-align:center; padding-top:40px">
                    <div style="font-size:60px; margin-bottom:20px">⚠️</div>
                    <h1 style="color:var(--error)">${title}</h1>
                    <p style="color:var(--text-light)">${msg}</p>
                </div>`;
        }

        function showPinScreen(guest, event) {
            renderLayout(
                '🔐',
                'أدخل الرقم السري',
                'هذه الدعوة محمية. أدخل الرقم السري للمتابعة.',
                `<div class="guest-card" style="text-align:center">
                    <div class="guest-name">${guest.name}</div>
                    <div style="margin-bottom:16px">
                        <input type="password" id="pinInput" maxlength="6" 
                            style="width:80%; text-align:center; font-size:28px; letter-spacing:0.5em; padding:12px; border:2px solid #e2e8f0; border-radius:12px; outline:none; font-family:monospace;"
                            placeholder="• • • •" />
                    </div>
                    <p id="pinError" style="color:var(--error); display:none; margin-bottom:12px; font-weight:bold;">❌ الرقم السري غير صحيح</p>
                    <button id="pinSubmit" style="width:80%; padding:14px; background:var(--primary); color:white; border:none; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; font-family:'Cairo',sans-serif;">🔓 تحقق ودخول</button>
                 </div>`
            );

            const pinInput = document.getElementById('pinInput');
            const pinSubmit = document.getElementById('pinSubmit');
            const pinError = document.getElementById('pinError');
            let isProcessing = false;

            pinInput.focus();
            pinInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') verifyPin();
            });
            pinSubmit.addEventListener('click', verifyPin);

            // Normalize Arabic digits
            function normalizePin(p) {
                if (!p) return '';
                const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
                let normalized = String(p);
                for (let i = 0; i < 10; i++) {
                    normalized = normalized.replace(arabicNumbers[i], i.toString());
                }
                return normalized.trim();
            }

            async function verifyPin() {
                if (isProcessing) return;
                const entered = pinInput.value;
                if (!entered) return;
                
                if (normalizePin(entered) === normalizePin(event.host_pin)) {
                    isProcessing = true;
                    pinSubmit.innerHTML = '✅ جاري التحميل...';
                    pinSubmit.style.background = 'var(--success)';
                    pinSubmit.style.opacity = '0.9';
                    pinError.style.display = 'none';

                    // PIN correct — Persist in session and proceed DIRECTLY
                    sessionStorage.setItem(`pin_verified_${qrToken}`, '1');
                    
                    // Direct transition - no reload!
                    proceedToCheckIn(guest, event);
                } else {
                    pinError.textContent = '❌ الرقم السري غير صحيح';
                    pinError.style.display = 'block';
                    pinInput.value = '';
                    pinInput.style.borderColor = 'var(--error)';
                    pinInput.focus();
                    setTimeout(() => { pinInput.style.borderColor = '#e2e8f0'; }, 1500);
                }
            }
        }

        init();
    </script>
</body>

</html>
