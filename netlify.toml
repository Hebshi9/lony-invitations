[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  port = 5173

# Serve check-in.html as a standalone static file (not through React SPA)
[[redirects]]
  from = "/check-in.html"
  to = "/check-in.html"
  status = 200

# Proxy to Remote WhatsApp VPS (Bypass Mixed Content Block)
[[redirects]]
  from = "/api/remote-whatsapp/*"
  to = "http://62.171.172.76:3001/api/whatsapp/:splat"
  status = 200
  force = true

# Proxy to Remote Sales AI VPS
[[redirects]]
  from = "/api/remote-sales/*"
  to = "http://62.171.172.76:3001/api/sales/:splat"
  status = 200
  force = true

# SPA fallback for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
